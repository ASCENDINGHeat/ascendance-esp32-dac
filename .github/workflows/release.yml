name: Publish ASCENDANCE Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-firmware:
    name: Build Release Firmware (ESP-IDF v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESP32-S3 ASCENDANCE Binaries
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
          (cd build && esptool.py --chip esp32s3 merge_bin -o ascendance-firmware-${RELEASE_TAG}-merged.bin @flash_args)
          cp build/ASCENDANCE.bin build/ascendance-firmware-${RELEASE_TAG}.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            build/ascendance-firmware-*-merged.bin
            build/ascendance-firmware-*.bin

  build-android:
    name: Build Release Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble Android Companion APK
        working-directory: tools/android_companion
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ascendance-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            gradle testDebugUnitTest assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/ascendance-android-companion-${RELEASE_TAG}.apk
          else
            gradle testDebugUnitTest assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/ascendance-android-companion-${RELEASE_TAG}-debug.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: tools/android_companion/app/build/outputs/apk/ascendance-android-companion-*.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-firmware, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets

      - name: Package WebHID Tuner
        run: cp tools/webhid_tuner/index.html release-assets/ascendance-webhid-tuner-${RELEASE_TAG}.html

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Project ASCENDANCE ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            release-assets/ascendance-firmware-*-merged.bin
            release-assets/ascendance-firmware-*.bin
            release-assets/ascendance-webhid-tuner-*.html
            release-assets/ascendance-android-companion-*.apk
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
