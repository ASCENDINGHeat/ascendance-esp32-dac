name: Build ASCENDANCE Android Companion

on:
  push:
    branches: [ "main", "dev", "staging" ]
    paths:
      - 'tools/android_companion/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ "main", "dev", "staging" ]
    paths:
      - 'tools/android_companion/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & Test Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests, Lint & Assemble Debug APK
        working-directory: tools/android_companion
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Build Signed Release APK (when keystore secrets configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: tools/android_companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ascendance-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascendance-android-companion-debug
          path: tools/android_companion/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK Artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ascendance-android-companion-release
          path: tools/android_companion/app/build/outputs/apk/release/*.apk
